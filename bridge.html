<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Sentinel Admin | Relay Bridge</title>
</head>
<body style="background: transparent;">
    <!-- Ce fichier est une antenne invisible qui fait le pont entre le Local et le Web -->
    <script>
        // Liste des clés que nous autorisons à synchroniser
        const ALLOWED_PREFIXES = ['chat_', 'appointments', 'admin_proj'];

        // Fonction pour extraire et envoyer les données du site vers l'Admin Local
        function syncToLocal() {
            const data = {};
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                // On ne synchronise que ce qui est important
                if (ALLOWED_PREFIXES.some(prefix => key.startsWith(prefix))) {
                    data[key] = localStorage.getItem(key);
                }
            }
            // Envoi au parent (ton fichier Sentinel Admin local)
            window.parent.postMessage({ 
                type: 'SYNC_FROM_WEB', 
                payload: data 
            }, "*");
        }

        // 1. Écouter les changements sur le site (ex: le client envoie un message)
        window.addEventListener('storage', (e) => {
            syncToLocal();
        });

        // 2. Écouter les ordres venant de l'Admin Local (ex: l'admin répond)
        window.addEventListener('message', (event) => {
            // Sécurité : on accepte les messages pour écrire dans le stockage distant
            if (event.data.type === 'WRITE_TO_WEB') {
                localStorage.setItem(event.data.key, event.data.value);
                // Optionnel : notifier les autres onglets
                syncToLocal();
            }
        });

        // 3. Premier envoi au chargement
        syncToLocal();

        console.log("✅ Pont Sentinel Relay activé sur " + window.location.hostname);
    </script>
</body>
</html>
