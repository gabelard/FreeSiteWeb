<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Sentinel Bridge</title>
</head>
<body style="background: #000; color: #32d74b; font-family: monospace; font-size: 10px;">
    [ BRIDGE RELAY ACTIVE ]
    <script>
        // 1. ÉCOUTER les commandes (depuis l'Admin local ou l'Espace Client)
        window.addEventListener('message', (event) => {
            // Sécurité : Optionnel, tu peux décommenter la ligne suivante en prod
            // if (!event.origin.includes("github.io") && !event.origin.includes("null")) return;

            const data = event.data;

            // CAS A : L'Admin envoie une donnée vers le Web (ex: réponse chat ou % projet)
            if (data.type === 'WRITE_TO_WEB') {
                localStorage.setItem(data.key, data.value);
                
                // On prévient toutes les fenêtres ouvertes sur le même domaine
                window.parent.postMessage({
                    type: 'SYNC_FROM_BRIDGE',
                    key: data.key,
                    value: data.value
                }, "*");
            }

            // CAS B : L'Admin demande une mise à jour de tout ce qui est sur le Web
            if (data.type === 'PULL_FROM_WEB') {
                sendAllDataToAdmin();
            }
        });

        // 2. ENVOYER les données vers l'Admin local
        function sendAllDataToAdmin() {
            const allData = {};
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                allData[key] = localStorage.getItem(key);
            }

            window.parent.postMessage({
                type: 'SYNC_FROM_WEB',
                payload: allData
            }, "*");
        }

        // 3. AUTO-SYNC : Envoyer les données à l'Admin dès qu'il y a un changement sur le Web
        window.addEventListener('storage', (e) => {
            sendAllDataToAdmin();
        });

        // Initialisation : Envoyer les données dès que l'iframe est chargée
        setTimeout(sendAllDataToAdmin, 500);
    </script>
</body>
</html>
